apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp
spec:
  nodeSelector:
    matchExpressions:
    - key: eks.amazonaws.com/compute-type
      operator: In
      values:
      - hybrid
  bgpInstances:
  - name: "rack0"
    localASN: 65002
    peers:
    - name: "vyos-router"
      peerASN: 65002
      peerAddress: 172.30.1.2
      peerConfigRef:
        name: "cilium-peer"
